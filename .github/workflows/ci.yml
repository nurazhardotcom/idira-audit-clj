# GitHub Actions CI for pam-audit-clj.
# Native Babashka gates cover the CLI and real local HTTP integration.
# JVM and Node-targeted ClojureScript runners share the portable contract.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ripgrep and check identity coherence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          if rg 'github\.com/nurazhar[^d]|gitlab\.com/nurazhardotcom' .; then
            echo "incoherent username found"
            exit 1
          fi

      - name: Install Babashka
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install
          sudo ./install

      - name: Run native test suite
        run: bb test

      - name: Run audit demo (five-findings contract)
        run: bb audit-demo

  shared-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Install ripgrep and check identity coherence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          if rg 'github\.com/nurazhar[^d]|gitlab\.com/nurazhardotcom' .; then
            echo "incoherent username found"
            exit 1
          fi

      - name: Install Clojure CLI
        run: |
          curl -fsSLO https://download.clojure.org/install/linux-install-1.12.6.1673.sh
          chmod +x linux-install-1.12.6.1673.sh
          sudo ./linux-install-1.12.6.1673.sh

      - name: Show test runtime versions
        run: |
          java -version
          clojure -Sdescribe
          node --version

      - name: Run portable JVM contract
        run: clojure -M:test

      - name: Compile portable ClojureScript contract for Node
        run: clojure -M:test-cljs

      - name: Run portable ClojureScript contract on Node
        run: node target/cljs-tests.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ripgrep and check identity coherence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          if rg 'github\.com/nurazhar[^d]|gitlab\.com/nurazhardotcom' .; then
            echo "incoherent username found"
            exit 1
          fi

      - name: Install clj-kondo
        run: |
          curl -sLO https://github.com/clj-kondo/clj-kondo/releases/download/v2026.08.04/clj-kondo-2026.08.04-linux-amd64.zip
          curl -sLO https://github.com/clj-kondo/clj-kondo/releases/download/v2026.08.04/clj-kondo-2026.08.04-linux-amd64.zip.sha256
          echo "$(cat clj-kondo-2026.08.04-linux-amd64.zip.sha256)  clj-kondo-2026.08.04-linux-amd64.zip" | sha256sum -c -
          mkdir -p kondo-tmp && unzip -q clj-kondo-2026.08.04-linux-amd64.zip -d kondo-tmp
          sudo install -m 0755 kondo-tmp/clj-kondo /usr/local/bin/clj-kondo
          clj-kondo --version

      - name: Lint (errors and warnings fail)
        run: clj-kondo --lint src test --fail-level warning

  pdpa-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install ripgrep + babashka
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          if rg 'github\.com/nurazhar[^d]|gitlab\.com/nurazhardotcom' .; then
            echo "incoherent username found"
            exit 1
          fi
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install && sudo ./install

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nurazhardotcom/pdpa-sg-clj
          path: pdpa-sg-clj

      - name: scan repo for Singapore PII / secrets (NRIC, tokens)
        run: |
          mv "$GITHUB_WORKSPACE/pdpa-sg-clj" /tmp/pdpa-sg-clj
          output=$(cd /tmp/pdpa-sg-clj && bb scan "$GITHUB_WORKSPACE")
          echo "$output"
          echo "$output" | grep -q "clean? true"
